<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task-1" />
                <label for="task-1">Learn Programming</label>
                <ul class="sub-item">
                    <li><a href="www.freeCodeCamp.com" class="sub-item-link" target="_blank">freeCodeCamp Course</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-2" />
                <label for="task-2">Learn Cooking</label>
                <ul class="sub-item">
                    <li><a href="www.youtube.com" class="sub-item-link" target="_blank">Cooking Playlist</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-3" />
                <label for="task-3">Explore Sportswear</label>
                <ul class="sub-item">
                    <li><a href="www.shopee.com" class="sub-item-link" target="_blank">Store Link</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-4" />
                <label for="task-4">Finish Assignment</label>
                <ul class="sub-item">
                    <li><a href="www.gdrive.com" class="sub-item-link" target="_blank">Submition Link</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
